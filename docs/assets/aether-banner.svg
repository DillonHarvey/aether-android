    <rect x="919" y="168" width="45" height="45" rx="12" fill="#5EEAD4" fill-opacity="0.85"/>
    <path d="M932 198L942 179L952 198M937 190H947" stroke="#142C3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
