      <text x="259" y="113" fill="#B9BDD9" font-size="12" font-weight="600" letter-spacing="3.5">THE AETHER PROJECT</text>
      <text x="255" y="187" fill="#F6F7FF" font-size="72" font-weight="700" letter-spacing="-3">Aether</text>
      <text x="260" y="229" fill="#D6DAED" font-size="23">Android apps, at home on Windows.</text>
