<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aether — Android apps, at home on Windows</title>
  <desc id="description">An original violet and teal Aether emblem beside a phone and a desktop window connected by flowing lines. This is an illustration of the project vision, not an application screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10172F"/>
      <stop offset="0.55" stop-color="#171A3B"/>
      <stop offset="1" stop-color="#102C3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="65" y1="95" x2="225" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B9EFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="connection" x1="750" y1="140" x2="978" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99BFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#8273E8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8273E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C3D0FF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="250" cy="150" rx="330" ry="280" fill="url(#halo)"/>
    <path d="M664 367C780 175 957 398 1212 87" stroke="#5EEAD4" stroke-opacity="0.1" stroke-width="40"/>
    <path d="M640 355C788 116 956 345 1226 23" stroke="#B8ACFF" stroke-opacity="0.07" stroke-width="2"/>
    <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#BAC8FF" stroke-opacity="0.12"/>

    <rect x="62" y="99" width="160" height="160" rx="42" fill="#C0B7FF" fill-opacity="0.04" stroke="#B9ACFF" stroke-opacity="0.2"/>
    <path d="M100 218L142 137L184 218M119 187H165" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="191" cy="126" r="5" fill="#5EEAD4"/>

